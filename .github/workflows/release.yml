name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Validate release version and architecture
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          export CLICKMAPPER_VERSION="${RELEASE_TAG#v}"
          . ./scripts/version.sh
          test "$RELEASE_TAG" = "v$CLICKMAPPER_VERSION"
          test "$(uname -m)" = "$EXPECTED_ARCH"
          echo "CLICKMAPPER_VERSION=$CLICKMAPPER_VERSION" >> "$GITHUB_ENV"
          swift --version
      - name: Test keyboard mapping
        run: ./scripts/test.sh
      - name: Package installer
        run: ./scripts/package-app.sh
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist
      - name: Create checksums
        working-directory: dist
        run: sha256sum *.dmg > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          Download the arm64 installer for Apple silicon or x86_64 for Intel Macs. Requires macOS 14 or later.

          Quit ClickMapper, open the DMG, and drag ClickMapper.app to Applications. Eject the DMG and launch the installed app. Grant Bluetooth and Accessibility access; fully quit and reopen if keyboard posting remains denied.

          These builds are ad-hoc signed and are not notarized by Apple. macOS Gatekeeper may block opening a downloaded build. Updates may require granting Accessibility permission again.
          NOTES
          gh release create "$RELEASE_TAG" dist/*.dmg dist/SHA256SUMS.txt \
            --verify-tag --title "ClickMapper $RELEASE_TAG" \
            --notes-file notes.md --generate-notes
